<!DOCTYPE html>
<html lang="bn" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>বিডি জব সার্কুলার | Daily Bangladesh Jobs</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config={darkMode:"class",theme:{extend:{fontFamily:{sans:["Hind Siliguri","Inter","sans-serif"]},colors:{brand:{500:"#22c55e",600:"#16a34a",700:"#15803d",950:"#052e16"}}}}};
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{font-family:"Hind Siliguri",Inter,sans-serif;-webkit-tap-highlight-color:transparent}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:#0f172a}::-webkit-scrollbar-thumb{background:#334155;border-radius:999px}
.line-clamp-2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
</style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
<header class="sticky top-0 z-40 bg-slate-900/95 backdrop-blur border-b border-slate-800">
  <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between gap-3">
    <button id="brandBtn" class="flex items-center gap-3 text-left">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-600 to-emerald-400 grid place-items-center font-bold">বিডি</div>
      <div><h1 class="font-bold text-white">দৈনিক চাকরির বিজ্ঞপ্তি</h1><p class="text-[11px] text-slate-400 hidden sm:block">সরকারি, ব্যাংক, ডিফেন্স ও প্রাইভেট চাকরি</p></div>
    </button>
    <div class="flex gap-2">
      <button id="refreshBtn" class="px-3 py-2 rounded-xl bg-brand-600 hover:bg-brand-500 text-xs font-semibold">↻ <span class="hidden sm:inline">রিফ্রেশ</span></button>
      <button id="savedBtn" class="px-3 py-2 rounded-xl bg-slate-800 border border-slate-700 text-xs">🔖 <span class="hidden sm:inline">সংরক্ষিত</span> <b id="savedCount">0</b></button>
      <button id="langBtn" class="px-3 py-2 rounded-xl bg-slate-800 border border-slate-700 text-xs">EN</button>
    </div>
  </div>
</header>

<section class="border-b border-slate-800 bg-slate-900/70">
  <div class="max-w-7xl mx-auto px-4 py-2 flex flex-wrap justify-between gap-2 text-xs text-slate-400">
    <span>● Data: <b class="text-emerald-400">jobs.json</b> • source links are shown per job</span>
    <span>শেষ আপডেট: <b id="updatedAt" class="text-slate-200">লোড হচ্ছে...</b></span>
  </div>
</section>

<main class="max-w-7xl mx-auto px-4 py-5 space-y-5">
  <section class="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-4">
    <input id="search" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 outline-none focus:border-brand-500 text-sm" placeholder="প্রতিষ্ঠান, পদ, যোগ্যতা বা keyword দিয়ে খুঁজুন...">
    <div class="flex flex-wrap gap-2">
      <button class="cat active px-3 py-1.5 rounded-xl bg-brand-600 text-xs font-semibold" data-cat="ALL">সব</button>
      <button class="cat px-3 py-1.5 rounded-xl bg-slate-800 text-xs" data-cat="GOVT">🏛️ সরকারি</button>
      <button class="cat px-3 py-1.5 rounded-xl bg-slate-800 text-xs" data-cat="BANK">🏦 ব্যাংক</button>
      <button class="cat px-3 py-1.5 rounded-xl bg-slate-800 text-xs" data-cat="DEFENCE">🛡️ ডিফেন্স</button>
      <button class="cat px-3 py-1.5 rounded-xl bg-slate-800 text-xs" data-cat="PRIVATE">💼 প্রাইভেট/NGO</button>
      <button id="endingBtn" class="px-3 py-1.5 rounded-xl bg-slate-800 text-xs">⏳ ৫ দিনের মধ্যে</button>
    </div>
    <div class="flex flex-wrap items-center gap-2">
      <span class="text-xs text-slate-400">Sort:</span>
      <select id="sort" class="bg-slate-800 border border-slate-700 rounded-xl px-3 py-1.5 text-xs">
        <option value="NEWEST">নতুন আগে</option><option value="DEADLINE">ডেডলাইন আগে</option><option value="VACANCY">বেশি পদ আগে</option>
      </select>
      <span id="resultCount" class="ml-auto text-xs text-slate-400"></span>
    </div>
  </section>

  <section id="grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></section>
  <section id="empty" class="hidden text-center py-16 bg-slate-900 border border-slate-800 rounded-2xl">
    <div class="text-4xl mb-2">🔎</div><h2 class="font-bold">কোনো চাকরি পাওয়া যায়নি</h2>
    <p class="text-xs text-slate-400 mt-1">Search/filter পরিবর্তন করে আবার চেষ্টা করো।</p>
  </section>
</main>

<div id="modal" class="hidden fixed inset-0 z-50 bg-black/80 p-3 sm:p-6 overflow-y-auto">
 <div class="max-w-3xl mx-auto my-6 bg-slate-900 border border-slate-700 rounded-2xl overflow-hidden">
  <div class="p-4 border-b border-slate-800 flex justify-between gap-3">
   <div><span id="mCat" class="text-[11px] px-2 py-1 rounded bg-brand-950 text-brand-300"></span><h2 id="mTitle" class="font-bold text-lg mt-2"></h2><p id="mOrg" class="text-xs text-brand-400 mt-1"></p></div>
   <button id="closeModal" class="text-slate-400 text-xl">✕</button>
  </div>
  <div class="p-4 space-y-4">
   <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">
    <div class="box"><small>পদ</small><b id="mVac"></b></div><div class="box"><small>ডেডলাইন</small><b id="mDeadline"></b></div><div class="box"><small>যোগ্যতা</small><b id="mEdu"></b></div><div class="box"><small>বয়স</small><b id="mAge"></b></div>
   </div>
   <div class="bg-slate-800/50 rounded-xl p-4"><p id="mSummary" class="text-sm text-slate-300 leading-relaxed"></p></div>
   <div class="flex flex-wrap gap-2">
    <a id="mApply" target="_blank" rel="noopener" class="px-4 py-2 rounded-xl bg-brand-600 text-white text-xs font-bold">অফিসিয়াল আবেদন ↗</a>
    <a id="mSource" target="_blank" rel="noopener" class="px-4 py-2 rounded-xl bg-slate-800 border border-slate-700 text-xs">Source / Notice ↗</a>
    <button id="mSave" class="px-4 py-2 rounded-xl bg-slate-800 border border-slate-700 text-xs">🔖 সংরক্ষণ</button>
    <button id="mShare" class="px-4 py-2 rounded-xl bg-slate-800 border border-slate-700 text-xs">শেয়ার</button>
   </div>
  </div>
 </div>
</div>

<div id="toast" class="fixed bottom-5 right-5 z-[60] hidden px-4 py-3 rounded-xl bg-slate-900 border border-slate-700 text-xs shadow-2xl"></div>

<style>.box{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:10px;text-align:center}.box small{display:block;color:#94a3b8;font-size:10px}.box b{display:block;color:#f8fafc;font-size:12px;margin-top:3px}</style>
<script>
let jobs=[], category="ALL", query="", sort="NEWEST", ending=false, saved=new Set(JSON.parse(localStorage.getItem("bdjobs-saved")||"[]")), lang="BN", selected=null, savedOnly=false;
const $=id=>document.getElementById(id);
const bn=n=>String(n??"").replace(/\d/g,d=>"০১২৩৪৫৬৭৮৯"[d]);
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
function daysLeft(date){const d=new Date(date+"T23:59:59");return Math.ceil((d-Date.now())/86400000)}
function toast(t){$("toast").textContent=t;$("toast").classList.remove("hidden");clearTimeout(window._toast);window._toast=setTimeout(()=>$("toast").classList.add("hidden"),2500)}
function persist(){localStorage.setItem("bdjobs-saved",JSON.stringify([...saved]));$("savedCount").textContent=saved.size}
function filtered(){
 let a=jobs.filter(j=>{
  if(category!=="ALL"&&j.category!==category)return false;
  if(savedOnly&&!saved.has(j.id))return false;
  if(ending){const d=daysLeft(j.deadline);if(d<0||d>5)return false}
  if(query){const hay=[j.title,j.titleEn,j.organization,j.organizationEn,j.educationText,j.summary].join(" ").toLowerCase();if(!hay.includes(query.toLowerCase()))return false}
  return true;
 });
 if(sort==="NEWEST")a.sort((x,y)=>new Date(y.publishDate)-new Date(x.publishDate));
 if(sort==="DEADLINE")a.sort((x,y)=>new Date(x.deadline)-new Date(y.deadline));
 if(sort==="VACANCY")a.sort((x,y)=>(y.vacanciesNum||0)-(x.vacanciesNum||0));
 return a;
}
function render(){
 const a=filtered();$("resultCount").textContent=`${bn(a.length)} টি সার্কুলার`;
 $("grid").innerHTML=a.map(j=>{
  const d=daysLeft(j.deadline), hot=d>=0&&d<=5;
  const title=lang==="BN"?j.title:j.titleEn, org=lang==="BN"?j.organization:j.organizationEn;
  return `<article class="bg-slate-900 border ${hot?"border-amber-500/40":"border-slate-800"} rounded-2xl p-4 flex flex-col gap-4">
   <div class="flex justify-between gap-2"><span class="text-[10px] px-2 py-1 rounded bg-slate-800">${esc(j.categoryEn||j.category)}</span><button onclick="toggleSave('${esc(j.id)}')" class="text-lg">${saved.has(j.id)?"🔖":"☆"}</button></div>
   <div><button onclick="openJob('${esc(j.id)}')" class="text-left font-bold text-sm leading-snug hover:text-brand-400 line-clamp-2">${esc(title)}</button><p class="text-xs text-brand-400 mt-1">${esc(org)}</p></div>
   <div class="flex flex-wrap gap-2 text-[10px]"><span class="bg-slate-800 rounded-lg px-2 py-1">পদ: <b>${esc(j.vacancies)}</b></span><span class="bg-slate-800 rounded-lg px-2 py-1">${esc(j.educationLevel||"যোগ্যতা")}</span></div>
   <div class="mt-auto pt-3 border-t border-slate-800 flex items-center justify-between gap-2"><span class="text-[10px] text-slate-400">শেষ: <b class="${hot?"text-amber-300":"text-slate-200"}">${esc(j.deadlineBn||j.deadline)}</b></span><div class="flex gap-1"><a href="${esc(j.applyUrl)}" target="_blank" rel="noopener" class="px-2.5 py-1.5 rounded-lg bg-brand-600 text-[10px] font-bold">আবেদন</a><button onclick="openJob('${esc(j.id)}')" class="px-2.5 py-1.5 rounded-lg bg-slate-800 border border-slate-700 text-[10px]">বিস্তারিত</button></div></div>
  </article>`;
 }).join("");
 $("empty").classList.toggle("hidden",a.length>0);
}
async function loadJobs(){
 $("refreshBtn").disabled=true;
 try{
  const r=await fetch("./data/jobs.json?ts="+Date.now(),{cache:"no-store"}); if(!r.ok)throw Error("jobs.json not found");
  const data=await r.json(); jobs=Array.isArray(data)?data:(data.jobs||[]);
  $("updatedAt").textContent=data.updatedAt||"—"; render(); toast("✓ Job data updated");
 }catch(e){console.error(e);toast("⚠️ jobs.json লোড করা যায়নি");}
 finally{$("refreshBtn").disabled=false}
}
window.toggleSave=id=>{saved.has(id)?saved.delete(id):saved.add(id);persist();render();if(selected?.id===id)openJob(id)};
window.openJob=id=>{
 selected=jobs.find(j=>j.id===id);if(!selected)return;
 $("mCat").textContent=selected.categoryEn||selected.category;$("mTitle").textContent=lang==="BN"?selected.title:selected.titleEn;$("mOrg").textContent=selected.organization;
 $("mVac").textContent=selected.vacancies||"—";$("mDeadline").textContent=selected.deadlineBn||selected.deadline;$("mEdu").textContent=selected.educationText||"—";$("mAge").textContent=selected.ageLimit||"—";$("mSummary").textContent=selected.summary||"";
 $("mApply").href=selected.applyUrl||"#";$("mSource").href=selected.sourceUrl||selected.applyUrl||"#";$("mSave").textContent=saved.has(id)?"🔖 সংরক্ষিত":"🔖 সংরক্ষণ";
 $("modal").classList.remove("hidden");
};
$("mSave").onclick=()=>selected&&toggleSave(selected.id);
$("mShare").onclick=async()=>{if(!selected)return;const text=`${selected.title}\n${selected.applyUrl||""}`;if(navigator.share)try{await navigator.share({title:selected.title,text,url:selected.applyUrl})}catch{}else{await navigator.clipboard?.writeText(text);toast("লিংক কপি হয়েছে")}};
$("closeModal").onclick=()=>$("modal").classList.add("hidden");$("modal").onclick=e=>{if(e.target.id==="modal")$("modal").classList.add("hidden")};
$("refreshBtn").onclick=loadJobs;
$("brandBtn").onclick=()=>{category="ALL";query="";savedOnly=false;$("search").value="";document.querySelectorAll(".cat").forEach(x=>x.classList.toggle("active",x.dataset.cat==="ALL"));render()};
$("savedBtn").onclick=()=>{savedOnly=!savedOnly;$("savedBtn").classList.toggle("bg-amber-600",savedOnly);render()};
$("search").oninput=e=>{query=e.target.value.trim();render()};$("sort").onchange=e=>{sort=e.target.value;render()};
document.querySelectorAll(".cat").forEach(b=>b.onclick=()=>{category=b.dataset.cat;document.querySelectorAll(".cat").forEach(x=>x.classList.remove("active","bg-brand-600"));document.querySelectorAll(".cat").forEach(x=>x.classList.add("bg-slate-800"));b.classList.add("active","bg-brand-600");b.classList.remove("bg-slate-800");render()});
$("endingBtn").onclick=()=>{ending=!ending;$("endingBtn").classList.toggle("bg-rose-600",ending);render()};
$("langBtn").onclick=()=>{lang=lang==="BN"?"EN":"BN";$("langBtn").textContent=lang==="BN"?"EN":"বাং";render();if(selected)openJob(selected.id)};
$("savedCount").textContent=saved.size;loadJobs();
</script>
</body>
</html>
